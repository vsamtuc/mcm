apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: api
          imagePullPolicy: Never
          env:
            - name: LOG_LEVEL
              value: debug
            - name: KEYCLOAK_URL
              value: "http://mcm-keycloak.mcm.svc.cluster.local:8080"
            - name: KEYCLOAK_BROWSER_URL
              value: "http://keycloak.mcm.minikube"
            - name: KEYCLOAK_REALM
              value: mcm
            - name: KEYCLOAK_CLIENT_ID
              value: mcm
            - name: AUTH_SKIP_PATHS
              value: "/, /ui/activity"
