apiVersion: batch/v1
kind: Job
metadata:
  name: mcm-migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: docker.io/vsam/mcm-migrate:none  # overridden per environment
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mcm-db-secret
                  key: DATABASE_URL
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -euo pipefail
              migrate -path /migrations -database "$DATABASE_URL" up
          terminationMessagePolicy: FallbackToLogsOnError
