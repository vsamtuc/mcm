apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: keycloak }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: idp
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.4.7  # override per env
          args: 
            - start      # in dev overlay you may use: "start-dev"
            - --import-realm
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              valueFrom: { secretKeyRef: { name: keycloak-db-secret, key: KC_DB_URL } }
            - name: KC_DB_USERNAME
              valueFrom: { secretKeyRef: { name: keycloak-db-secret, key: KC_DB_USERNAME } }
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-db-secret, key: KC_DB_PASSWORD } }
            - name: KEYCLOAK_ADMIN
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: username } }
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: password } }
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm

          # For some strange reason, the probes below cause Keycloak to fail to start in minikube.

          #startupProbe:
          #  httpGet: { path: /health/started, port: 9000 }
          #  periodSeconds: 1
          #  failureThreshold: 600
          #readinessProbe:
          #  httpGet: { path: /health/ready, port: 9000 }
          #  periodSeconds: 10
          #  failureThreshold: 3
          #livenessProbe:
          #  httpGet: { path: /health/live,  port: 9000 }
          #  periodSeconds: 10
          #  failureThreshold: 3

