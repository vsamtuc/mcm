apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: api }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: api
          image: docker.io/vsam/mcm:none  # overridden in overlays
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mcm-db-secret
                  key: DATABASE_URL
            - name: KEYCLOAK_URL
              value: "http://mcm-keycloak.mcm.svc.cluster.local:8080"
            - name: KEYCLOAK_BROWSER_URL
              value: "http://mcm-keycloak.mcm.svc.cluster.local:8080"
            - name: KEYCLOAK_REALM
              value: "mcm"
            - name: KEYCLOAK_CLIENT_ID
              value: "mcm"
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /livez, port: http }
